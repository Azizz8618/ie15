; ie15-demo.ini — минимальный конфиг БЭСМ-6 для демонстрации терминала 15ИЭ.
; Строка TTY2 вынесена в telnet-порт 4202; к нему подключается SSH-мост
; (besm6/ssh_bridge.py), а к мосту — эмулятор терминала.
;
;   BIN/besm6 ie15-demo.ini
;
set -n console log=besm6_ie15.log
set cpu idle
set cpu autotime=on

; Барабаны и системные диски (как в OSZAGR/dispak.ini)
attach -e drum0 ~/Yandex.Disk/simh/BESM6/MB/drum1x.bin
attach -e drum1 ~/Yandex.Disk/simh/BESM6/MB/drum2x.bin
attach -e md01 ~/Yandex.Disk/simh/BESM6/MD/2148
attach -r md02 ~/Yandex.Disk/simh/BESM6/MD/2248
attach -e md04 ~/Yandex.Disk/simh/BESM6/MD/2095
attach -e md05 ~/Yandex.Disk/simh/BESM6/MD/2063
attach -e md07 ~/Yandex.Disk/simh/BESM6/MD/2253

; Печать
attach -n prn0 /tmp/ie15_besm6_out.txt

; Терминальные линии: tty2 — «Фрязинский дисплей» (порт для SSH-моста)
attach tty2 4202
set tty2 tt,authbs

; Обнуление первой страницы ОЗУ (как с регистров при включении)
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Загрузка ОС Диспак (как в OSZAGR/dispak.ini)
load ~/Yandex.Disk/simh/BESM6/OSZAGR/boot_dispak.b6
run 2000