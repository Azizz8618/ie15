# Конфигурация эмулятора терминала «Электроника 15ИЭ-00-013».
# Аргументы командной строки имеют приоритет над этим файлом.
# Путь: ie15.conf рядом с пакетом ie15emu (или --conf ФАЙЛ).

[line]
# Способ подключения: ssh (через мост besm6/ssh_bridge.py)
#                     tcp (напрямую к telnet-линии SIMH)
type = ssh
# Адрес сервера с БЭСМ-6 (или с SSH-мостом)
server = besm6.cs.msu.ru
# Номер канала: порт telnet-линии SIMH (строка `attach ttyN <порт>` в ini).
# Можно задать несколько: список («4202,4210») или диапазон («4202-4223») —
# подключение идёт по порядку; занятая линя (ЭВМ отвечает
# «Line connection busy») пропускается, берётся следующий порт.
# То же в ключe --port (он важнее конфига).
port = 4202-4223
# Порт SSH (22 — обычный sshd сервера; 2222 — локальный мост)
ssh_port = 22

[ssh]
# Дефолтная учётная запись сервера БЭСМ-6
user = test
# Файл закрытого ключа по умолчанию; пусто или отсутствующий файл — пароль
keyfile = ~/.ssh/besm_test
# Пароль используется, если ключ не задан/не найден (например ie15)
password =

[terminal]
# Режим сеанса: host (С ЭВМ) или local (АВТОНОМНО)
mode = host
# НАБОР — единый режим терминала (клавиша F8 перебирает по кругу):
#   n0 — знаки ASCII (ISO 646 IRV: ¤ ¬ ¯), команды — только УП
#   n1 — русские знаки верхнего и нижнего регистра (КОИ-7 Н1),
#        включает русскую раскладку; команды — только УП
#   n2 — набор команд №2 (VT-52) и международная строка знаков —
#        по умолчанию, рабочий режим линии БЭСМ-6
nabor = n2
# Устаревшие ключи (уступают nabor): набор команд при запуске
sets = 2
# «История» выдачи над экраном (строки, сошедшие с верхнего края кадра);
# листается PgUp/PgDn. 0 — не сохранять.
history = 1000
# Набор знаков дисплея (ГОСТ 27463-87, КОИ-7):
#   n0 — международный (ISO 646 IRV: ¤ ¬ ¯ вместо $ ^ ~), по умолчанию
#charset = n0   # устаревший: см. nabor (n1 == charset=n1+набор №1)
# Русская раскладка: клавиши QWERTY печатают русские буквы, Shift+клавиша
# переключает алфавит на английский (как «регистр» на 15ВВВ).
#   layout = positional — по положению клавиш ЙЦУКЕН (q→Й, w→Ц): по умолчанию
#   layout = phonetic   — фонетическая (q→Я, w→В, x→Ч)
#   layout = off        — выключена (тогда koi7 тоже игнорируется)
layout = positional
# koi7 = true включает раскладку, если layout не задан (позиционную)
koi7 = false

[keys]
# Переназначение клавиш: «что прислал терминал = что набирать».
# Применяется до правил набора (Н2/Н1/раскладка). Ключ и значение —
# обычный знак, строка, KEY-имя или код «\xNN» (шестнадцатеричный байт,
# который присылает Ctrl+клавиша). Пустое значение гасит клавишу.
# Нажатый и не заданный УП виден в подвале («ПОСЛ: УП NN») — по этому
# коду и правят привязку, если ваш терминал шлёт другой байт.
# Знак «=» ключом не выразить (разделитель ini). Комментарии — только
# отдельными строками, внутри значений их быть не должно.
# Требуемые привязки русской раскладки (без CapsLock):
# ctrl+Б = <, ctrl+Ю = >, ctrl+Х = [, ctrl+Ъ = ], ctrl+6 = ^,
# shift+? = | (обычный | проходит и без привязки).
\x11 = <
\x0e = >
\x18 = [
\x05 = [
\x1d = ]
\x1e = ^
# Клавиша ]/ъ даёт ] и без привязки — встроенной картой Н2.
# Если терминал отвечает на опрос CSI-u (kitty, foot, wezterm, alacritty;
# xterm: -modifyOtherKeys 2 -formatOtherKeys 1) — нажатие приходит знаком
# С МОДИФИКАТОРОМ и не дублируется с обычными знаками; тогда те же
# шесть привязок работают именами клавиш (реестр знака важен — точное
# имя незакрытого нажатия видно в подвале ПОСЛ):
ctrl+б = <
ctrl+Б = <
ctrl+ю = >
ctrl+Ю = >
ctrl+х = [
ctrl+Х = [
ctrl+ъ = ]
ctrl+Ъ = ]
ctrl+6 = ^
# Alt-префикс (ESC+знак) читается и без CSI-u — те же шесть привязок
# вторым модификатором, на случай если Ctrl терминал теряет:
alt+б = <
alt+Б = <
alt+ю = >
alt+Ю = >
alt+х = [
alt+Х = [
alt+ъ = ]
alt+Ъ = ]
alt+6 = ^
# «shift+? = |»: если сочетание приходит как «|» — проходит и так; если
# терминал шлёт имя вида «shift+7» или другой код — привяжите по ПОСЛ.
